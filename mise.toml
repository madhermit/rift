[tools]
go = "1.25"

[env]
# gotreesitter embeds all 206 grammars by default; restrict the build to the
# languages `rift review --tests` actually parses so the binary stays small.
# This keeps the build pure-Go (no CGO) and cross-compilable with plain GOOS/GOARCH.
GRAMMAR_TAGS = "grammar_subset,grammar_subset_javascript,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_ruby,grammar_subset_python,grammar_subset_rust"

[tasks.build]
description = "Build rift binary"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -tags "${GRAMMAR_TAGS}" -ldflags "-X github.com/madhermit/rift/cmd.Version=${VERSION}" -o rift .
"""

[tasks.test]
description = "Run tests"
run = 'go test -tags "${GRAMMAR_TAGS}" ./...'

[tasks.fmt]
description = "Format code"
run = "go fmt ./..."

[tasks.lint]
description = "Run linter"
run = 'go vet -tags "${GRAMMAR_TAGS}" ./...'

[tasks.check]
description = "Run all checks (fmt, lint, test)"
depends = ["fmt", "lint", "test"]

[tasks.install]
description = "Install rift to ~/.local/bin"
run = """
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
go build -tags "${GRAMMAR_TAGS}" -ldflags "-X github.com/madhermit/rift/cmd.Version=${VERSION}" -o ~/.local/bin/rift .
"""

[tasks.release]
description = "Build release binaries for all platforms"
run = """
#!/usr/bin/env bash
set -euo pipefail
VERSION=${1:-dev}
LDFLAGS="-s -w -X github.com/madhermit/rift/cmd.Version=${VERSION}"
mkdir -p dist

echo "Building version: $VERSION"

# Linux
GOOS=linux GOARCH=amd64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-linux-amd64 .
GOOS=linux GOARCH=arm64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-linux-arm64 .

# macOS
GOOS=darwin GOARCH=amd64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-darwin-amd64 .
GOOS=darwin GOARCH=arm64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-darwin-arm64 .

echo "Built binaries in dist/"
ls -la dist/
"""

[tasks.demo]
description = "Regenerate demo screenshots + GIFs with VHS (needs vhs + ttyd)"
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run build
bash demo/setup.sh
mkdir -p docs/images
export PATH="$PWD:$PATH"
# Pre-warm difftastic so the recording never captures a first-run download.
(cd /tmp/rift-demo && rift diff --print >/dev/null 2>&1 || true)
for tape in demo/diff.tape demo/log.tape demo/stash.tape demo/stage.tape; do
  echo "vhs $tape"
  vhs "$tape"
done
rm -f docs/images/log.gif docs/images/stash.gif
echo "Wrote docs/images/{diff,log,stash,stage}.png + diff.gif, stage.gif"
"""
