name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRAMMAR_TAGS: grammar_subset,grammar_subset_javascript,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_ruby,grammar_subset_python,grammar_subset_rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Vet
        run: go vet -tags "${GRAMMAR_TAGS}" ./...

      - name: Test
        run: go test -tags "${GRAMMAR_TAGS}" ./...

      - name: Build
        run: go build -tags "${GRAMMAR_TAGS}" -o rift .
