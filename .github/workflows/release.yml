name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Restrict gotreesitter's embedded grammars to the languages rift parses;
      # keeps the build pure-Go so plain GOOS/GOARCH cross-compilation works.
      GRAMMAR_TAGS: grammar_subset,grammar_subset_javascript,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_ruby,grammar_subset_python,grammar_subset_rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test -tags "${GRAMMAR_TAGS}" ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w -X github.com/madhermit/rift/cmd.Version=${VERSION}"

          # Linux
          GOOS=linux GOARCH=amd64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-linux-arm64 .

          # macOS
          GOOS=darwin GOARCH=amd64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -tags "${GRAMMAR_TAGS}" -ldflags "${LDFLAGS}" -o dist/rift-darwin-arm64 .

      - name: Generate checksums
        run: |
          # Sum only the binaries (bare filenames) so install.sh can verify a
          # single downloaded binary against SHA256SUMS.
          cd dist
          sha256sum rift-* > SHA256SUMS
          cat SHA256SUMS

      - name: Bundle third-party licenses
        # Non-blocking: if go-licenses can't classify a dependency, the step
        # fails but the release still ships (just without the license bundle).
        continue-on-error: true
        env:
          GOFLAGS: -tags=${{ env.GRAMMAR_TAGS }}
        run: |
          go run github.com/google/go-licenses@latest save ./... \
            --save_path=third-party-licenses --force
          tar -czf dist/third-party-licenses.tar.gz third-party-licenses

      - name: Extract changelog section
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          NUM=${VERSION#v}
          awk -v ver="$NUM" '
            $0 ~ "^## \\[" ver "\\]" { f=1; next }
            f && (/^## \[/ || /^\[.*\]: /) { exit }
            f { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true

      - name: Bump Homebrew formula
        # Regenerates madhermit/homebrew-tap's Formula/rift.rb wholesale from
        # this release's checksums (the tap file is generated output — edit this
        # template, not the tap). Needs a TAP_PUSH_TOKEN secret: a fine-grained
        # PAT with contents:write on madhermit/homebrew-tap. Skips quietly when
        # the secret is absent so a missing token never blocks a release.
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "TAP_PUSH_TOKEN not set; skipping Homebrew bump"
            exit 0
          fi
          VERSION=${GITHUB_REF#refs/tags/}
          NUM=${VERSION#v}
          sum() { awk -v f="$1" '$2 == f {print $1}' dist/SHA256SUMS; }
          git clone --depth 1 "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/madhermit/homebrew-tap.git" tap
          cat > tap/Formula/rift.rb <<EOF
          class Rift < Formula
            desc "Syntax-aware git TUI: structural diffs, hunk staging, and a --tests lens"
            homepage "https://github.com/madhermit/rift"
            version "${NUM}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/madhermit/rift/releases/download/${VERSION}/rift-darwin-arm64"
                sha256 "$(sum rift-darwin-arm64)"
              else
                url "https://github.com/madhermit/rift/releases/download/${VERSION}/rift-darwin-amd64"
                sha256 "$(sum rift-darwin-amd64)"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/madhermit/rift/releases/download/${VERSION}/rift-linux-arm64"
                sha256 "$(sum rift-linux-arm64)"
              else
                url "https://github.com/madhermit/rift/releases/download/${VERSION}/rift-linux-amd64"
                sha256 "$(sum rift-linux-amd64)"
              end
            end

            def install
              bin.install Dir["rift-*"].first => "rift"
              generate_completions_from_executable(bin/"rift", "completion")
            end

            test do
              assert_match "rift version v#{version}", shell_output("#{bin}/rift version")
            end
          end
          EOF
          cd tap
          git -c user.name=madhermit -c user.email=1425712+madhermit@users.noreply.github.com \
            commit -am "rift ${NUM}"
          git push origin HEAD
